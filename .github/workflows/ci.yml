name: CI

on:
  push:
    tags:
      - 'v*'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm zip
      - run: pnpm zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: dist/*.zip
      - name: Take the release notes from the tag message
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="$GITHUB_REF_NAME"
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          notes="$(git tag -l --format='%(contents:body)' "$tag")"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            version="${tag#v}"
            notes="$(awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2)"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
          body_path: ${{ runner.temp }}/release-notes.md
